<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product price table</title>
</head>
<body>
  <h2 align="center">Store Price List</h2>

<table border="1" cellpadding="10" align="center">
  <tr>
    <th>Product Name</th>
    <th>Quantity</th>
    <th>Price (₦)</th>
  </tr>

  <tr>
    <td>Rice</td>
    <td>2 Bags</td>
    <td>80,000</td>
  </tr>

  <tr>
    <td>Beans</td>
    <td>1 Bag</td>
    <td>45,000</td>
  </tr>

  <tr>
    <td>Garri</td>
    <td>1 Bag</td>
    <td>25,000</td>
  </tr>

  <tr>
    <th colspan="2">Total</th>
    <th>150,000</th>
  </tr>
</table>

</body>
</html>
