<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly class timetable</title>
</head>
<body>
  <h2>Weekly Class Timetable</h2>

<table cellpadding="10">
  <tr>
    <th>Day</th>
    <th>8am – 10am</th>
    <th>10am – 12pm</th>
    <th>12pm – 2pm</th>
  </tr>

  <tr>
    <td>Monday</td>
    <td rowspan="2">Mathematics</td>
    <td>English</td>
    <td>Computer</td>
  </tr>

  <tr>
    <td>Tuesday</td>
    <td>Physics</td>
    <td>Chemistry</td>
  </tr>

  <tr>
    <td>Wednesday</td>
    <td colspan="3" align="center">BREAK</td>
  </tr>

  <tr>
    <td>Thursday</td>
    <td>Biology</td>
    <td rowspan="2">ICT</td>
    <td>Economics</td>
  </tr>

  <tr>
    <td>Friday</td>
    <td>Government</td>
    <td>CRS</td>
  </tr>
</table>

</body>
</html>
